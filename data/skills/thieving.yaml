# data/skills/thieving.yaml — Thieving skill data for Rune-Jit
#
# Single source of truth for all Thieving values.
# The ThievingPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Source: https://oldschool.runescape.wiki/w/Thieving
# License: CC BY-NC-SA 3.0 (wiki content)

meta:
  skill: THIEVING
  ticks_per_attempt: 4            # Pickpocket attempt cycle — 4 ticks (2.4s) per attempt
                                   # https://oldschool.runescape.wiki/w/Thieving#Pickpocketing
  # Pickpocketing uses an interpolated level-based success curve (success_low at
  # the action's level_required, success_high at level 99). On failure the player
  # is stunned for stun_ticks ticks and takes stun_damage. Stalls always succeed
  # (no stun) and deplete with a respawn timer.
  # Source: https://oldschool.runescape.wiki/w/Thieving#Mechanics

# ---------------------------------------------------------------------------
# Pickpocket targets (NPCs)
# ---------------------------------------------------------------------------
# Source: https://oldschool.runescape.wiki/w/Thieving#Pickpocketing
# XP source: https://oldschool.runescape.wiki/w/Thieving#Pickpocketing
#
# success_low  : success chance (0..255 scale) at level_required
# success_high : success chance (0..255 scale) at level 99
# stun_ticks   : ticks the player is stunned on a failed pickpocket
# stun_damage  : damage dealt on a failed pickpocket
# npc_ids      : NPC definition IDs — populated from cache after /load-osrs-cache-full
# loot         : weighted loot table; one entry rolled on success by weight

pickpockets:
  MAN:
    level_required: 1             # https://oldschool.runescape.wiki/w/Man
    xp: 8.0                       # https://oldschool.runescape.wiki/w/Thieving#Pickpocketing
    npc_ids: []                   # Populated from cache after /load-osrs-cache-full
    success_low: 168              # https://oldschool.runescape.wiki/w/Thieving#Success_rate
    success_high: 240             # https://oldschool.runescape.wiki/w/Thieving#Success_rate
    stun_ticks: 4                 # 4-tick stun on failure — https://oldschool.runescape.wiki/w/Stun
    stun_damage: 1                # https://oldschool.runescape.wiki/w/Man
    loot:
      - item_id: 995              # Coins (3) — https://oldschool.runescape.wiki/w/Coins
        qty: 3
        weight: 1
