# data/skills/smithing.yaml — Smithing skill data for Rune-Jit
#
# Single source of truth for all Smithing values.
# SmithingPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Smithing has two stages:
#   1. SMELTING — combine ores into a metal bar at a furnace (`bars` map).
#   2. SMITHING — hammer a number of bars into an item at an anvil (`smithing` map).
#
# Source: https://oldschool.runescape.wiki/w/Smithing
# License: CC BY-NC-SA 3.0 (wiki content)

meta:
  skill: SMITHING
  ticks_per_attempt: 4          # 4 ticks = 2.4s per smelt/smith action
                                 # https://oldschool.runescape.wiki/w/Smithing#Mechanics
  hammer_item_id: 2347          # https://oldschool.runescape.wiki/w/Hammer (required at the anvil)
  # Object IDs for furnace/anvil are populated from cache after /cache-unpack-extract-assets.
  furnace_object_ids: []        # https://oldschool.runescape.wiki/w/Furnace
  anvil_object_ids: []          # https://oldschool.runescape.wiki/w/Anvil

