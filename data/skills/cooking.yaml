# data/skills/cooking.yaml — Cooking skill data for Rune-Jit
#
# Single source of truth for all Cooking values.
# CookingPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Source: https://oldschool.runescape.wiki/w/Cooking
# License: CC BY-NC-SA 3.0 (wiki content)

meta:
  skill: COOKING
  ticks_per_attempt: 4         # 4 ticks = 2.4 seconds per item cooked
                                # https://oldschool.runescape.wiki/w/Cooking#Mechanics
  cooking_gauntlets_item_id: 775   # https://oldschool.runescape.wiki/w/Cooking_gauntlets
  cook_animation: 897           # TODO: verify from cache index 12 after /load-osrs-cache-full

# ---------------------------------------------------------------------------
# Burn-chance mechanic (implemented in CookingAction.kt, not evaluated here)
#
# Each food has a level at which the player stops burning it ("stop_burn_level").
# Burn chance scales linearly from the level the food can first be cooked down to
# (almost) zero at stop_burn_level. Cooking on a range burns less than on a fire,
# so range stop-burn levels are lower than fire stop-burn levels.
#
# We model the per-food burn stop with two thresholds:
#   stop_burn_level_range : level at/above which you never burn this food on a range
#   stop_burn_level_fire  : level at/above which you never burn this food on a fire
#
# Cooking gauntlets (item 775) lower the effective stop-burn level for lobster,
# swordfish, and shark (see uses_gauntlets / gauntlets_stop_burn_level_range).
#
# Source: https://oldschool.runescape.wiki/w/Cooking#Burn_level
# Community burn data: https://oldschool.runescape.wiki/w/Cooking#Cooking_food
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Fire & range objects
# ---------------------------------------------------------------------------
# Object IDs come from cache after /cache-unpack-extract-assets. Until then the
# plugin skips registration (mirrors FishingPlugin's empty-id guard). The lists
# stay empty here so no fabricated object IDs leak into the data file.
# fire objects: https://oldschool.runescape.wiki/w/Fire
# range objects: https://oldschool.runescape.wiki/w/Cooking_range
fire_object_ids: []            # populated post-cache-extraction
range_object_ids: []           # populated post-cache-extraction

