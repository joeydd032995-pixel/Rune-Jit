# data/skills/construction.yaml — Construction skill data for Rune-Jit
#
# Single source of truth for all Construction values.
# ConstructionPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value has an inline wiki citation.
#
# NOTE: Construction's YAML shape (planks / rooms / furniture / servants) is distinct
# from the gathering-skill schema (skill-data.schema.json). The schema covers Woodcutting;
# this file is self-describing and validated via ConstructionParityTest.
#
# Source: https://oldschool.runescape.wiki/w/Construction
# License: CC BY-NC-SA 3.0 (wiki content)

meta:
  skill: CONSTRUCTION
  ticks_per_build: 2          # 2 ticks (1.2 s) per furniture build animation
                               # https://oldschool.runescape.wiki/w/Construction#Building_furniture
  tool_saw_item_id: 8794       # Saw — required tool (not consumed)
                               # https://oldschool.runescape.wiki/w/Saw
  tool_hammer_item_id: 2347    # Hammer — required tool (not consumed)
                               # https://oldschool.runescape.wiki/w/Hammer

