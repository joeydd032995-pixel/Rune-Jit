# data/skills/hunter.yaml — Hunter skill data for Rune-Jit
#
# Single source of truth for all trap-based Hunter values.
# The HunterPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Source: https://oldschool.runescape.wiki/w/Hunter
# License: CC BY-NC-SA 3.0 (wiki content)
#
# Scope: trap-based Hunter only (bird snaring, box trapping). Tracking, falconry,
# net trapping, and deadfall trapping are deferred to a later content pass.

meta:
  skill: HUNTER
  # check_ticks below is per-creature (varies by trap type), so meta carries the
  # baseline trap-check interval used when a creature omits its own check_ticks.
  # A trap is rolled for a catch every check_ticks game ticks.
  default_check_ticks: 1          # trap state is evaluated each tick the action runs
                                  # https://oldschool.runescape.wiki/w/Hunter#Trapping

# ---------------------------------------------------------------------------
# Catch-rate formula (implemented in HunterAction.kt, not evaluated here)
#
#   Per trap-check tick, the catch probability is linearly interpolated between
#   catch_rate_low (at the creature's level_required) and catch_rate_high
#   (at Hunter level 99), then a roll succeeds when:
#
#     rand(catch_rate_resolution) < floor(p * catch_rate_resolution)
#
#   where p is the interpolated probability for the player's current Hunter level.
#
# Exact Jagex catch-rate curves are not published; catch_rate_low/high are
# community-researched approximations. See ADR-008 (to be written) for sourcing.
# Source: https://oldschool.runescape.wiki/w/Hunter#Trapping
# ---------------------------------------------------------------------------

config:
  catch_rate_resolution: 1000     # probabilities are rolled out of 1000 for integer arithmetic
                                  # https://oldschool.runescape.wiki/w/Hunter#Trapping
  # Max simultaneous traps scale with Hunter level (1 base, +1 per 20 levels).
  # Source: https://oldschool.runescape.wiki/w/Hunter#Multiple_traps
  base_max_traps: 1
  traps_per_levels: 20

# ---------------------------------------------------------------------------
# Pet — Baby chinchompa (grey variant default)
# ---------------------------------------------------------------------------
# Source: https://oldschool.runescape.wiki/w/Baby_chinchompa
# NOTE: exact rate not officially confirmed; community approximation.

pet:
  name: BABY_CHINCHOMPA
  item_id: 13323                  # Baby chinchompa (Grey) — https://oldschool.runescape.wiki/w/Baby_chinchompa
  base_rate: 65536                # community-approximated 1-in-N at the creature's level
                                  # https://oldschool.runescape.wiki/w/Baby_chinchompa
  scales_with_level: true
  wiki: "https://oldschool.runescape.wiki/w/Baby_chinchompa"

