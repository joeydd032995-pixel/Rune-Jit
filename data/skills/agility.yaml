# data/skills/agility.yaml — Agility skill data for Rune-Jit
#
# Single source of truth for all Agility values.
# AgilityPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Source: https://oldschool.runescape.wiki/w/Agility
# License: CC BY-NC-SA 3.0 (wiki content)

meta:
  skill: AGILITY
  default_ticks: 2              # default ticks per obstacle if an obstacle omits `ticks`
                               # https://oldschool.runescape.wiki/w/Agility
  mark_of_grace_item_id: 11849 # ItemIds.MARK_OF_GRACE
                               # https://oldschool.runescape.wiki/w/Mark_of_grace

# ---------------------------------------------------------------------------
# Mark of Grace
# ---------------------------------------------------------------------------
# Marks of Grace spawn at a random obstacle once per (successful) course lap,
# on a per-course chance. They are rooftop-course-only and used to buy Graceful.
# Source: https://oldschool.runescape.wiki/w/Mark_of_grace
#
# completion_bonus_xp is awarded once, on clearing the FINAL obstacle of a lap
# (the rooftop courses grant a large lap-completion XP bonus on top of the
# per-obstacle XP). Source: https://oldschool.runescape.wiki/w/Agility#Rooftop_courses
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Rooftop Agility Courses
# ---------------------------------------------------------------------------
# Each course is a sequence of obstacles cleared in order. The final obstacle
# of the sequence awards completion_bonus_xp and triggers the Mark of Grace roll.
#
# obstacle xp / level / completion bonus values:
#   https://oldschool.runescape.wiki/w/Agility#Rooftop_courses
# mark_of_grace_chance is the 1-in-N lap chance of a mark spawning (null = none).
# object_id values are placeholders (0) pending cache extraction
# (/load-osrs-cache-full); registration is skipped for zero/empty IDs.

