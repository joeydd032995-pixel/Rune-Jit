# data/skills/crafting.yaml — Crafting skill data for Rune-Jit
#
# Single source of truth for all Crafting recipe values.
# CraftingPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Source: https://oldschool.runescape.wiki/w/Crafting
# License: CC BY-NC-SA 3.0 (wiki content)
#
# Recipe shape:
#   <CATEGORY>:
#     <RECIPE_NAME>:
#       level_required: <int>          # Crafting level required
#       xp: <number>                   # exact XP per craft (wiki)
#       inputs: [{item_id, qty}, ...]  # consumed materials
#       tools: [item_id, ...]          # required (not consumed) tools
#       output_item_id: <int>
#       output_qty: <int>
#       station: <FURNACE|null>        # required nearby station, or null
#       wiki: "<url>"

meta:
  skill: CRAFTING
  ticks_per_attempt: 3        # 3 ticks (1.8s) per craft for most making actions
                               # https://oldschool.runescape.wiki/w/Crafting

