# data/skills/runecraft.yaml — Runecraft skill data for Rune-Jit
#
# Single source of truth for all Runecraft values.
# RunecraftPlugin.kt loads this file at startup — no values are hardcoded in Kotlin.
# Every value below has an inline wiki citation.
#
# Mechanic: the player uses Rune/Pure essence on (or interacts with) an altar.
# All essence in the inventory is consumed at once; each essence yields one or more
# runes depending on the player's Runecraft level (the "multiple runes" thresholds).
# XP is awarded per essence crafted (a flat xp_per_essence per altar), NOT per rune.
#
# Source: https://oldschool.runescape.wiki/w/Runecraft
# License: CC BY-NC-SA 3.0 (wiki content)

meta:
  skill: RUNECRAFT
  ticks_per_attempt: 1          # Crafting at the altar resolves in a single action.
                                # https://oldschool.runescape.wiki/w/Runecraft#Mechanics
  rune_essence_item_id: 1436    # https://oldschool.runescape.wiki/w/Rune_essence
  pure_essence_item_id: 7936    # https://oldschool.runescape.wiki/w/Pure_essence

# ---------------------------------------------------------------------------
# Altars
# Source: https://oldschool.runescape.wiki/w/Runecraft#Runes
#
# For each rune:
#   level_required    — Runecraft level to craft this rune.
#   xp_per_essence    — base XP granted per essence (one essence = one craft).
#   rune_item_id      — the rune produced.
#   essence_item_id   — rune essence (low runes) or pure essence (members runes).
#   altar_object_id   — the altar object (TODO: verify from cache via /load-osrs-cache-full).
#   talisman_item_id  — talisman to enter the ruin (null where no item-id constant exists).
#   multiple_thresholds — level→runes_per_essence rule. The highest threshold whose
#                         level is <= the player's Runecraft level applies. A base
#                         entry at level 1 with runes_per_essence 1 is always present.
#
# Multiple-rune levels are exact wiki values:
# https://oldschool.runescape.wiki/w/Runecraft#Multiple_runes_per_essence
# ---------------------------------------------------------------------------

